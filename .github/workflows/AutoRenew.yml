name: Server Auto Renew

on:
#  schedule:
#    - cron: '37 6 * * *' # 每天北京时间 14:37 自动运行
  workflow_dispatch:
    inputs:
      retry_count:
        description: '自动重试次数'
        required: false
        default: '0'

permissions:
  actions: write
  contents: read

jobs:
  renew_job:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库代码
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Enable WARP Network
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # 4. 运行续期脚本 (限制 3 分钟超时)
      - name: Run renew script
        id: renew
        timeout-minutes: 3
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python renew.py 2>&1 | tee renew.log

# 5. 发送 TG 通知 (精准反映实际操作情况)
      - name: Send Telegram Notification
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ID: ${{ secrets.TG_USER_ID }}
          RENEW_OUTCOME: ${{ steps.renew.outcome }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_ID" ]; then
            echo "⚠️ 未配置 TG_BOT_TOKEN 或 TG_USER_ID，跳过 Telegram 通知发送。"
            exit 0
          fi

          # 1. 解析日志，提取核心字段
          SERVER_NAME=$(grep -oP '服务器名称:\s*\K[^\s|]+' renew.log || echo "未知")
          STATUS=$(grep -oP '状态:\s*\K[^\s|]+' renew.log || echo "未知")
          EXP_RAW=$(grep -oP '到期时间:\s*\K[^\s]+' renew.log | head -n 1)

          # 格式化 ISO 时间为可读格式 (如 2026-09-13 00:19:04 UTC)
          if [ -n "$EXP_RAW" ]; then
            EXP_TIME=$(echo "$EXP_RAW" | sed -E 's/T/ /; s/\.[0-9]+\+00:00/ UTC/')
          else
            EXP_TIME="未知"
          fi

          # 2. 根据日志关键字动态判断【真实标题】
          if [ "$RENEW_OUTCOME" = "cancelled" ]; then
            TITLE="⏰ Freemchost 运行超时"
          elif [ "$RENEW_OUTCOME" != "success" ]; then
            TITLE="❌ Freemchost 执行失败"
          elif grep -qE "续期成功|成功扩展|Renewed successfully" renew.log; then
            TITLE="✅ Freemchost 自动续期成功！"
          else
            TITLE="ℹ️ Freemchost 服务器状态检查"
          fi

          # 3. 组合排版整洁的消息文本
          MSG_TEXT=$(printf "%s\n\n🖥️ 服务器: %s\n📌 当前状态: %s\n⏳ 到期时间: %s" \
            "$TITLE" "$SERVER_NAME" "$STATUS" "$EXP_TIME")

          CLEAN_TOKEN=$(echo "$TG_TOKEN" | xargs)
          CLEAN_ID=$(echo "$TG_ID" | xargs)

          curl -s -X POST "https://api.telegram.org/bot${CLEAN_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CLEAN_ID}" \
            --data-urlencode "text=${MSG_TEXT}"

      # 6. 超时/失败自动触发重新运行 (最多重试 3 次)
      - name: Trigger Retry on Failure or Timeout
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RETRIES: 3
          CURRENT_RETRY: ${{ inputs.retry_count }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          RETRY_VAL="${CURRENT_RETRY:-0}"
          NEXT_RETRY=$((RETRY_VAL + 1))
          if [ "$NEXT_RETRY" -le "$MAX_RETRIES" ]; then
            echo "⚠️ 脚本执行超时或失败，正在自动发起第 $NEXT_RETRY 次重试..."
            gh workflow run "$WORKFLOW_NAME" -f retry_count="$NEXT_RETRY"
          else
            echo "🛑 已达到最大重试次数 ($MAX_RETRIES)，不再自动触发重新运行。"
          fi
